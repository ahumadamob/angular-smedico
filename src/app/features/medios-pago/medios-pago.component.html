<section class="feature">
  <header class="feature__header">
    <div>
      <h2>Medios de pago</h2>
      <p class="feature__subtitle">Administra los medios aceptados para los cobros.</p>
    </div>
    <button type="button" class="btn btn--primary" (click)="startCreate()" [disabled]="saving() || deleting()">
      Nuevo medio
    </button>
  </header>

  <div class="feature__body">
    <div class="alert alert--error" *ngIf="error() as errorMessage">{{ errorMessage }}</div>

    <div class="card">
      <div class="card__body">
        <div class="table-wrapper" *ngIf="hasItems(); else emptyState">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th class="table__actions">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of items(); trackBy: trackById">
                <td>{{ item.id | number }}</td>
                <td>{{ item.nombre }}</td>
                <td>
                  <span class="pill">{{ item.tipo | titlecase }}</span>
                </td>
                <td class="table__actions">
                  <button type="button" class="btn btn--ghost" (click)="startEdit(item)" [disabled]="saving() || deleting()">
                    Editar
                  </button>
                  <button type="button" class="btn btn--danger" (click)="promptDelete(item)" [disabled]="saving() || deleting()">
                    Eliminar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <ng-template #emptyState>
          <div class="empty" *ngIf="!loading(); else loadingState">
            <p>No hay medios de pago registrados.</p>
          </div>
        </ng-template>
        <ng-template #loadingState>
          <div class="loading">Cargando medios de pago...</div>
        </ng-template>
      </div>
    </div>

    <div class="card form-card" *ngIf="showForm()">
      <form [formGroup]="form" (ngSubmit)="submitForm()">
        <h3 class="form-card__title">{{ selectedItem() ? 'Editar medio' : 'Nuevo medio' }}</h3>

        <div class="form-grid">
          <label class="form-field">
            <span>Nombre</span>
            <input type="text" formControlName="nombre" [class.invalid]="form.controls.nombre.invalid && form.controls.nombre.touched" />
            <span class="error" *ngIf="form.controls.nombre.errors && form.controls.nombre.touched">
              <ng-container *ngIf="form.controls.nombre.hasError('required')">El nombre es obligatorio.</ng-container>
              <ng-container *ngIf="form.controls.nombre.hasError('minlength')">Debe tener al menos 3 caracteres.</ng-container>
              <ng-container *ngIf="form.controls.nombre.hasError('maxlength')">No debe superar 30 caracteres.</ng-container>
              <ng-container *ngIf="form.controls.nombre.hasError('api')">{{ form.controls.nombre.getError('api') }}</ng-container>
            </span>
          </label>

          <label class="form-field">
            <span>Tipo</span>
            <select formControlName="tipo" [class.invalid]="form.controls.tipo.invalid && form.controls.tipo.touched">
              <option value="" disabled>Selecciona un tipo</option>
              <option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo | titlecase }}</option>
            </select>
            <span class="error" *ngIf="form.controls.tipo.errors && form.controls.tipo.touched">
              <ng-container *ngIf="form.controls.tipo.hasError('required')">El tipo es obligatorio.</ng-container>
              <ng-container *ngIf="form.controls.tipo.hasError('api')">{{ form.controls.tipo.getError('api') }}</ng-container>
            </span>
          </label>
        </div>

        <div class="form-card__actions">
          <button type="button" class="btn btn--ghost" (click)="cancelForm()" [disabled]="saving()">Cancelar</button>
          <button type="submit" class="btn btn--primary" [disabled]="saving()">
            {{ saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<app-confirm-dialog
  [open]="confirmDeleteOpen()"
  title="Eliminar medio de pago"
  message="¿Seguro que deseas eliminar este medio de pago?"
  confirmLabel="Eliminar"
  cancelLabel="Cancelar"
  [busy]="deleting()"
  busyLabel="Eliminando..."
  [confirmDestructive]="true"
  (cancel)="closeDeleteDialog()"
  (confirm)="confirmDelete()"
></app-confirm-dialog>
