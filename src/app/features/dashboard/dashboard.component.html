<section class="dashboard" aria-live="polite">
  <header class="dashboard__header">
    <div>
      <h2>Bienvenido al dashboard de Smedico</h2>
      <p class="dashboard__subtitle">
        Consulta los indicadores principales de pacientes y equipo administrativo.
      </p>
    </div>
    <button class="btn-primary" type="button" (click)="refresh()" [disabled]="loading()">
      {{ loading() ? 'Actualizando…' : 'Actualizar métricas' }}
    </button>
  </header>

  <div class="dashboard__content" *ngIf="!loading(); else loadingTpl">
    <article *ngFor="let card of cards(); trackBy: trackByTitle" class="dashboard-card">
      <h3>{{ card.title }}</h3>
      <p>{{ card.description }}</p>
      <span class="badge badge--success">{{ card.hint }}</span>
    </article>
  </div>

  <ng-template #loadingTpl>
    <div class="dashboard__empty">
      <span class="spinner" aria-hidden="true"></span>
      <p>Cargando información inicial…</p>
    </div>
  </ng-template>
</section>
